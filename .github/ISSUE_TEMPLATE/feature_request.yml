name: Feature Request
description: Suggest an improvement for MeowBox documentation or service
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve?
      placeholder: It's hard to upload multiple files at once; I have to repeat the upload process.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to see?
      placeholder: A batch upload endpoint or drag-and-drop multi-file upload on the homepage.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What else have you thought of?
      placeholder: ZIP upload, WebDAV, client-side zip + single upload.

  - type: textarea
    id: impact
    attributes:
      label: Impact & Audience
      description: Who benefits, and how often?
      placeholder: Anyone uploading many small files (screenshots, assets) — daily for developers/designers.

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - This is a documentation improvement (not a service feature)
          required: false