name: Site Health Check

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    name: Verify site availability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (for issue templates)
        uses: actions/checkout@v4

      - name: Check homepage
        id: home
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://meowbox.dpdns.org/)
          echo "code=$code" >> $GITHUB_OUTPUT
          if [ "$code" != "200" ]; then
            echo "Homepage returned $code"
            exit 1
          fi

      - name: Check sitemap
        id: sitemap
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://meowbox.dpdns.org/sitemap.xml)
          echo "code=$code" >> $GITHUB_OUTPUT
          if [ "$code" != "200" ]; then
            echo "Sitemap returned $code"
            exit 1
          fi

      - name: Check robots.txt
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 10 https://meowbox.dpdns.org/robots.txt)
          if [ "$code" != "200" ]; then
            echo "robots.txt returned $code"
            exit 1
          fi

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[Health] Site check failed at ${new Date().toISOString()}`;
            const body = `Automated health check failed.\n\nFailed step: ${context.job}\n\nCheck the workflow run for details.`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-check'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['health-check', 'bug']
              });
            }